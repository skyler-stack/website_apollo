<head>
<meta charset="UTF-8">
<title>Contact Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EE;
    --paper-raised:#FCFBF7;
    --ink:#1B1B1F;
    --ink-soft:#5B5A54;
    --line:#DCD6C4;
    --line-soft:#E8E3D5;
    --accent:#255C4E;
    --accent-soft:#DCE9E2;
    --brass:#B8892B;
    --brass-soft:#F3E6C8;
    --tag-founder:#6B5B8C;
    --tag-founder-soft:#E9E4F3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{
    font-family:'IBM Plex Sans',-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:36px 28px 60px;}

  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2.5px solid var(--ink);
    padding-bottom:18px;margin-bottom:22px;
    flex-wrap:wrap;gap:14px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:500;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:38px;
    margin:0;
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  .stat-block{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .stat-num{font-size:30px;font-weight:500;color:var(--ink);line-height:1;}
  .stat-label{font-size:11px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}

  .controls{
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .search-box{
    position:relative;flex:1;min-width:220px;
  }
  .search-box input{
    width:100%;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    padding:11px 14px 11px 36px;
    border:1.5px solid var(--line);
    border-radius:2px;
    background:var(--paper-raised);
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--accent);}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;font-weight:500;letter-spacing:.03em;
    padding:9px 14px;
    border:1.5px solid var(--line);
    border-radius:2px;
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
    transition:all .12s;
    display:flex;align-items:center;gap:6px;
  }
  .chip .count{
    font-size:10px;opacity:.7;
  }
  .chip:hover{border-color:var(--ink-soft);color:var(--ink);}
  .chip.active{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .chip.active .count{opacity:.85;}

  .meta-row{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;color:var(--ink-soft);
    padding:0 2px 10px;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:0;
  }

  .table-shell{
    border:1.5px solid var(--ink);
    background:var(--paper-raised);
    overflow:hidden;
  }
  .table-scroll{
    overflow-x:auto;
    max-height:640px;
    overflow-y:auto;
  }
  table{border-collapse:collapse;width:100%;min-width:920px;}
  thead th{
    position:sticky;top:0;z-index:2;
    background:var(--ink);
    color:#F6F4EE;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    font-weight:500;
    text-align:left;
    padding:12px 14px;
    cursor:pointer;
    white-space:nowrap;
    border-right:1px solid rgba(255,255,255,.08);
  }
  thead th:hover{background:#2E2E33;}
  thead th .arrow{opacity:.55;margin-left:4px;font-size:9px;}
  thead th.sorted{color:var(--brass-soft);}
  thead th.sorted .arrow{opacity:1;color:var(--brass);}

  tbody td{
    padding:11px 14px;
    border-bottom:1px solid var(--line-soft);
    border-right:1px solid var(--line-soft);
    font-size:13.5px;
    vertical-align:top;
    white-space:nowrap;
    max-width:260px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  tbody tr:nth-child(even){background:#F4F1E9;}
  tbody tr:hover{background:var(--accent-soft);}
  tbody td:last-child, thead th:last-child{border-right:none;}

  .rownum{
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    font-size:11.5px;
    width:44px;
    text-align:right;
  }
  .name-cell{font-weight:600;font-family:'Fraunces',serif;font-size:14.5px;}
  .title-cell{color:var(--ink-soft);font-size:12.5px;}
  .company-cell{font-weight:500;}
  .email-cell{font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .email-cell a{color:var(--accent);text-decoration:none;}
  .email-cell a:hover{text-decoration:underline;}
  .tag-pills{display:flex;gap:4px;flex-wrap:wrap;white-space:normal;}
  .pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;font-weight:500;letter-spacing:.03em;
    padding:2.5px 7px;border-radius:2px;
    background:var(--accent-soft);color:var(--accent);
  }
  .pill.founder{background:var(--tag-founder-soft);color:var(--tag-founder);}
  .li-link{color:var(--ink-soft);text-decoration:none;font-size:12px;}
  .li-link:hover{color:var(--accent);}

  .pager{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--ink-soft);
    flex-wrap:wrap;gap:10px;
  }
  .pager-btns{display:flex;gap:6px;align-items:center;}
  .pager button{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:7px 12px;
    border:1.5px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    cursor:pointer;
    border-radius:2px;
  }
  .pager button:disabled{opacity:.35;cursor:default;}
  .pager button:not(:disabled):hover{border-color:var(--accent);color:var(--accent);}

  .empty-state{
    padding:60px 20px;text-align:center;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;font-size:13px;
  }

  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-track{background:var(--paper);}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>
</head>

<div class="wrap">

  <div class="masthead">

    </div>
  </div>

  <div class="pager">

      <button id="prevBtn">&lsaquo; Prev</button>
      <button id="nextBtn">Next &rsaquo;</button>
      <button id="lastBtn">Last &raquo;</button>
    </div>
  </div>

</div>

l.ai", "l": "http://www.linkedin.com/in/abhinavsomani", "city": "New York", "state": "New York", "country": "United States", "w": "https://cadastral.ai", "emp": "15", "ind": "information technology & services", "tags": ["CEO", "Founder"]}, {"n": "Eric Chang", "t": "Co-Founder & CEO", "c": "Claira", "e": "eric.chang@claira.io", "l": "http://www.linkedin.com/in/eric-mao-chang", "city": "New York", "state": "New York", "country": "United States", "w": "https://claira.io", "emp": "18", "ind": "information technology & services", "tags": ["CEO", "Founder"]}, {"n": "Boian Spassov", "t": "Chief Executive Officer", "c": "Locbit", "e": "boian.spassov@locbit.com", "l": "http://www.linkedin.com/in/boian-spassov", "city": "San Diego", "state": "California", "country": "United States", "w": "https://locbit.com", "emp": "11", "ind": "information technology & services", "tags": ["CEO"]}, {"n": "Dylan Feeney", "t": "CEO, Co-Founder", "c": "TBL Technologies", "e": "dylan@tblbuildings.com", "l": "http://www.linkedin.com/in/dylan-feeney-1a7aa91aa", "city": "New York", "state": "New York", "country": "United States", "w": "https://tblbuildings.com", "emp": "21", "ind": "real estate", "tags": ["CEO", "Founder"]}, {"n": "Perri Richman", "t": "Chief Marketing and Sustainability Officer", "c": "stellar DBA Albireo Energy, LLC", "e": "prichman@albireoenergy.com", "l": "http://www.linkedin.com/in/perririchman", "city": "New York", "state": "New York", "country": "United States", "w": "https://stellarbt.com", "emp": "9", "ind": "construction", "tags": ["CMO"]}, {"n": "Matt Engfer", "t": "Co-Founder, CEO", "c": "Cubby", "e": "matt@cubbystorage.com", "l": "http://www.linkedin.com/in/matthewengfer", "city": "New York", "state": "New York", "country": "United States", "w": "https://cubbystorage.com", "emp": "83", "ind": "information technology & services", "tags": ["CEO", "Founder"]}];
const PAGE_SIZE = 50;

const FILTERS = [
  {key:'ALL', label:'All'},
  {key:'CEO', label:'CEO'},
  {key:'COO', label:'COO'},
  {key:'CMO', label:'CMO'},
  {key:'CFO', label:'CFO'},
  {key:'CTO', label:'CTO'},
  {key:'Founder', label:'Founder'},
];

let activeFilters = new Set(['ALL']);
let searchTerm = '';
let sortKey = null;
let sortDir = 1;
let currentPage = 1;

// precompute counts
const counts = {};
FILTERS.forEach(f=>counts[f.key]=0);
DATA.forEach(r=>{
  counts.ALL++;
  r.tags.forEach(t=>{ if(counts[t]!==undefined) counts[t]++; });
});

const chipRow = document.getElementById('chipRow');
FILTERS.forEach(f=>{
  const chip = document.createElement('div');
  chip.className = 'chip' + (activeFilters.has(f.key) ? ' active' : '');
  chip.dataset.key = f.key;
  chip.innerHTML = `${f.label} <span class="count">${counts[f.key]}</span>`;
  chip.addEventListener('click', ()=>{
    if(f.key === 'ALL'){
      activeFilters = new Set(['ALL']);
    } else {
      activeFilters.delete('ALL');
      if(activeFilters.has(f.key)) activeFilters.delete(f.key);
      else activeFilters.add(f.key);
      if(activeFilters.size === 0) activeFilters = new Set(['ALL']);
    }
    currentPage = 1;
    render();
    document.querySelectorAll('.chip').forEach(c=>{
      c.classList.toggle('active', activeFilters.has(c.dataset.key));
    });
  });
  chipRow.appendChild(chip);
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  currentPage = 1;
  render();
});

document.querySelectorAll('thead th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(h=>h.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.arrow').textContent = sortDir === 1 ? '▾' : '▴';
    render();
  });
});

function getFiltered(){
  let rows = DATA;
  if(!activeFilters.has('ALL')){
    rows = rows.filter(r => r.tags.some(t=>activeFilters.has(t)));
  }
  if(searchTerm){
    rows = rows.filter(r=>
      (r.n && r.n.toLowerCase().includes(searchTerm)) ||
      (r.c && r.c.toLowerCase().includes(searchTerm)) ||
      (r.e && r.e.toLowerCase().includes(searchTerm)) ||
      (r.t && r.t.toLowerCase().includes(searchTerm)) ||
      (r.ind && r.ind.toLowerCase().includes(searchTerm))
    );
  }
  if(sortKey){
    rows = rows.slice().sort((a,b)=>{
      let av = a[sortKey] || '', bv = b[sortKey] || '';
      if(sortKey === 'emp'){
        av = parseInt(av)||0; bv = parseInt(bv)||0;
        return (av-bv)*sortDir;
      }
      return String(av).localeCompare(String(bv)) * sortDir;
    });
  }
  return rows;
}

function pillClass(tag){
  return tag === 'Founder' ? 'pill founder' : 'pill';
}

function render(){
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage-1)*PAGE_SIZE;
  const pageRows = filtered.slice(start, start+PAGE_SIZE);

  document.getElementById('resultCount').textContent = `Showing ${total} contacts`;
  document.getElementById('pageInfo').textContent = `Page ${currentPage} / ${totalPages}  ·  ${total} total`;
  document.getElementById('firstBtn').disabled = currentPage===1;
  document.getElementById('prevBtn').disabled = currentPage===1;
  document.getElementById('nextBtn').disabled = currentPage===totalPages;
  document.getElementById('lastBtn').disabled = currentPage===totalPages;

  const tbody = document.getElementById('tbody');
  if(pageRows.length === 0){
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">No matching contacts</div></td></tr>`;
    return;
  }

  tbody.innerHTML = pageRows.map((r,i)=>{
    const loc = [r.city, r.state].filter(Boolean).join(', ') || (r.country||'—');
    const pills = r.tags.length ? `<div class="tag-pills">${r.tags.map(t=>`<span class="${pillClass(t)}">${t}</span>`).join('')}</div>` : '—';
    const emailLink = r.e ? `<a href="mailto:${r.e}">${r.e}</a>` : '—';
    const liLink = r.l ? `<a class="li-link" href="${r.l}" target="_blank" rel="noopener">View &#8599;</a>` : '&mdash;';
    return `<tr>
      <td class="rownum">${start+i+1}</td>
      <td class="name-cell">${escapeHtml(r.n)}</td>
      <td class="title-cell">${escapeHtml(r.t)}${pills!=='—' ? '<br>'+pills : ''}</td>
      <td class="company-cell">${escapeHtml(r.c)}</td>
      <td class="email-cell">${emailLink}</td>
      <td>${escapeHtml(r.ind)||'—'}</td>
      <td>${r.emp||'—'}</td>
      <td>${escapeHtml(loc)}</td>
      <td>${liLink}</td>
    </tr>`;
  }).join('');
}

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('firstBtn').addEventListener('click', ()=>{currentPage=1;render();});
document.getElementById('prevBtn').addEventListener('click', ()=>{currentPage=Math.max(1,currentPage-1);render();});
document.getElementById('nextBtn').addEventListener('click', ()=>{currentPage++;render();});
document.getElementById('lastBtn').addEventListener('click', ()=>{currentPage=99999;render();});

render();
</script>
